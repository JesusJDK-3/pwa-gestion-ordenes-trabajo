name: Backup Base de Datos

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta diariamente a medianoche
  workflow_dispatch:      # Permite ejecutarlo manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get install -y postgresql-client

      - name: Realizar Backup
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump -h ${{ secrets.DB_HOST }} \
                  -p ${{ secrets.DB_PORT }} \
                  -U ${{ secrets.DB_USER }} \
                  -d ${{ secrets.DB_NAME }} \
                  -F c -b -v \
                  > backup_$(date +%Y%m%d).dump

      - name: Subir backup como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-db-${{ github.run_id }}
          path: backup_*.dump