name: Backup Base de Datos Supabase

on:
  schedule:
    - cron: '0 0 * * *' # Ejecuta automáticamente cada día a medianoche
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get install -y postgresql-client

      - name: Realizar Backup (pg_dump)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: nc -zv ${{ secrets.DB_HOST }} ${{ secrets.DB_PORT }}

      - name: Subir backup a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup_supabase_*.dump