# ═══════════════════════════════════════════════════════════════════════════════
#  CI — Integración continua (GitHub Actions)
#
#  Se ejecuta en cada push y pull request hacia main/master.
#  Valida que backend y frontend compilen y pasen pruebas antes de integrar.
# ═══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, master, melany]
  pull_request:
    branches: [main, master, melany]

# Cancela ejecuciones anteriores del mismo PR para ahorrar minutos de CI
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sistema-ot

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Permisos Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar tests
        run: mvn -B test
        env:
          SEED_DEMO_DATA: 'false'

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: Build de producción
        run: npm run build
        env:
          VITE_API_URL: /api
