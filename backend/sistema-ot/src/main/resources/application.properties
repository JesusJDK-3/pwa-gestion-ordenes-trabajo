# ──────────────────────────────────────────────────────────────────────────────
# KABJ GIS Field Operations — configuración de la aplicación
# Valores sensibles se leen desde variables de entorno.
# En producción DEBEN declararse: PG_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGIN
# ──────────────────────────────────────────────────────────────────────────────

spring.application.name=sistema-ot

# En producción: app.seed-demo-data=false y credenciales solo por variables de entorno
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ── Base de datos (PostgreSQL) ────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_ot
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD:melcita123}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: crea/actualiza tablas según las entidades JPA (development).
# En producción usar: validate (requiere ejecutar bootstrap.sql primero).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Carga de archivos ─────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────────────────────────────
# Mínimo 32 caracteres para HS256. En producción usar una clave aleatoria larga.
jwt.secret=${JWT_SECRET:kabj-sistema-ot-secret-key-2026-muy-larga-para-seguridad-hs256}
# Expiración en milisegundos (10 horas por defecto)
jwt.expiration=${JWT_EXPIRATION:36000000}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ── Integraciones externas ───────────────────────────────────────────────────
app.validacion-fotos.url=${VALIDACION_FOTOS_URL:http://45.71.33.77/proyecto_lima/}
