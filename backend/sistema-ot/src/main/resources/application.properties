# ──────────────────────────────────────────────────────────────────────────────
# KABJ GIS Field Operations — configuración de la aplicación
# Valores sensibles se leen desde variables de entorno.
# En producción DEBEN declararse: MYSQL_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGIN
# ──────────────────────────────────────────────────────────────────────────────

spring.application.name=sistema-ot

# ── Base de datos (MySQL - XAMPP) ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_ot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:admin1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: crea/actualiza tablas según las entidades JPA (development).
# En producción usar: validate (requiere ejecutar bootstrap.sql primero).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Carga de archivos ─────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────────────────────────────
# Mínimo 32 caracteres para HS256. En producción usar una clave aleatoria larga.
jwt.secret=${JWT_SECRET:kabj-sistema-ot-secret-key-2026-muy-larga-para-seguridad-hs256}
# Expiración en milisegundos (10 horas por defecto)
jwt.expiration=${JWT_EXPIRATION:36000000}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
