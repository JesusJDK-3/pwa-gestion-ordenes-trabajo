# ──────────────────────────────────────────────────────────────────────────────
# Perfil cloud — Railway (backend) + Supabase (PostgreSQL) + Vercel (frontend)
# Activar en Railway: SPRING_PROFILES_ACTIVE=cloud
# DataSource: CloudDataSourceConfig (DATABASE_URL o PG_URL o PGHOST…)
# ──────────────────────────────────────────────────────────────────────────────

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Evita segundo DataSource apuntando a localhost cuando DATABASE_URL viene de Supabase
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.seed-demo-data=${SEED_DEMO_DATA:true}

jwt.secret=${JWT_SECRET:kabj-sistema-ot-cloud-jwt-secret-key-2026-minimo-32-chars}
jwt.expiration=${JWT_EXPIRATION:36000000}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.validacion-fotos.url=${VALIDACION_FOTOS_URL:http://45.71.33.77/proyecto_lima/}
