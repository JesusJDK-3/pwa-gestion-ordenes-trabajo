# ──────────────────────────────────────────────────────────────────────────────
# Perfil cloud — Railway (backend) + Vercel (frontend)
# Activar con: SPRING_PROFILES_ACTIVE=cloud
# Requiere PostgreSQL vinculado (PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE)
# ──────────────────────────────────────────────────────────────────────────────

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Primera instalación: update crea tablas. Con bootstrap.sql aplicado usar validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

app.seed-demo-data=${SEED_DEMO_DATA:true}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}

# URL del frontend en Vercel (varias separadas por coma para previews)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

app.validacion-fotos.url=${VALIDACION_FOTOS_URL:http://45.71.33.77/proyecto_lima/}
