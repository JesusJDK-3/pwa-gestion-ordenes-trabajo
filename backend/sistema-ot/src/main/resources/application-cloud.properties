# Perfil cloud - Railway (backend) + Supabase (PostgreSQL) + Vercel (frontend)
# Activar en Railway: SPRING_PROFILES_ACTIVE=cloud

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Base de datos (elige UNA opcion en Railway)
#
# Opcion A - Supabase recomendada: JDBC + usuario/password por separado
#   PG_URL=jdbc:postgresql://db.xxxxx.supabase.co:5432/postgres?sslmode=require
#   PGUSER=postgres.xxxxx
#   PGPASSWORD=tu-password-supabase
#
# Opcion B - URI completa de Supabase; CloudDataSourceConfig separa credenciales
#   DATABASE_URL=postgresql://postgres.xxxxx:[PASSWORD]@db.xxxxx.supabase.co:5432/postgres
#
# Opcion C - Variables sueltas (Railway PostgreSQL plugin):
#   PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE

spring.datasource.url=${PG_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=require&prepareThreshold=0}
spring.datasource.username=${PGUSER:${PG_USER:postgres}}
spring.datasource.password=${PGPASSWORD:${PG_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Con scripts SQL completos en Supabase: validate.
# Sin script SQL previo: update (solo arranque inicial controlado).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.seed-demo-data=${SEED_DEMO_DATA:true}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}

# URL del frontend Vercel (varias separadas por coma para previews)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

app.validacion-fotos.url=${VALIDACION_FOTOS_URL:http://45.71.33.77/proyecto_lima/}
