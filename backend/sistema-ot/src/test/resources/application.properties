# Configuración global para TODOS los tests (CI y local sin PostgreSQL).
# Spring Boot carga este archivo antes que src/main/resources/application.properties.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=kabj-test-secret-key-para-pruebas-unitarias-2026
jwt.expiration=3600000
cors.allowed-origin=http://localhost:5173

app.seed-demo-data=false
