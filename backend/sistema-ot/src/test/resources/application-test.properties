# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURACIÓN DE PRUEBAS — Profile "test"
#
# Este archivo se activa cuando los tests usan @ActiveProfiles("test").
# Reemplaza la base de datos PostgreSQL por H2 en memoria (no necesita servidor).
#
# Ventaja: los tests de carga de contexto (@SpringBootTest) funcionan
# en cualquier equipo, incluso sin PostgreSQL instalado.
# ─────────────────────────────────────────────────────────────────────────────

# ── Base de datos H2 en memoria ───────────────────────────────────────────────
# H2 es una BD relacional liviana que corre completamente en memoria RAM.
# Se crea al iniciar el test y se destruye al terminar → siempre limpia.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate con H2 ────────────────────────────────────────────────────
# create-drop: crea las tablas al iniciar el contexto y las borra al cerrarlo.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── JWT para tests ────────────────────────────────────────────────────────────
# Clave de prueba (no importa su valor, solo que tenga >= 32 caracteres para HS256)
jwt.secret=kabj-test-secret-key-para-pruebas-unitarias-2026
jwt.expiration=3600000

# ── CORS (no relevante en tests, pero evita errores de bean faltante) ─────────
cors.allowed-origin=http://localhost:5173
