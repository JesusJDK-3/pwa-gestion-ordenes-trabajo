# Railway — despliegue del backend Spring Boot
# En Railway: Root Directory = backend/sistema-ot
# Añadir plugin PostgreSQL y variables de entorno (ver docs/GUIA-DEPLOY-Y-WORKFLOW.md)

[build]
builder = "NIXPACKS"
buildCommand = "mvn -B -DskipTests package"

[deploy]
startCommand = "java -jar target/sistema-ot-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
