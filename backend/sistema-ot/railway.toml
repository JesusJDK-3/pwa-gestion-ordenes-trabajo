# Railway — Backend Spring Boot (API REST)
# Root Directory = backend/sistema-ot
# Base de datos = Supabase (DATABASE_URL) — ver docs/DEPLOY-SUPABASE-RAILWAY-VERCEL.md

[build]
builder = "NIXPACKS"
buildCommand = "mvn -B -DskipTests package"

[deploy]
startCommand = "java -jar target/sistema-ot-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
